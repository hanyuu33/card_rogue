<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>APK</title><button id=g style="font-size:18px;padding:12px 20px">下载并组装 APK（约 99MB）</button><p id=s></p><script>const B='https://raw.githubusercontent.com/hanyuu33/card_rogue/apk-delivery/apk_delivery/part_',N=[0,1,2,3,4,5].map(i=>B+i.toString().padStart(2,'0'));async function f(u,t=6){for(let k=0;k<t;k++){try{let r=await fetch(u);if(r.ok)return r}catch(e){}await new Promise(r=>setTimeout(r,500))}throw 0}async function go(){let s=document.getElementById('s'),b=[],n=0;for(let i=0;i<N.length;i++){s.textContent='分卷 '+(i+1)+'/'+N.length+' 下载中…';let r=await f(N[i]);let ab=await r.arrayBuffer();b.push(new Uint8Array(ab));n+=ab.byteLength}s.textContent='拼接中…';let o=new Uint8Array(n),p=0;for(const x of b){o.set(x,p);p+=x.length}let u=URL.createObjectURL(new Blob([o],{type:'application/vnd.android.package-archive'}));let an=document.createElement('a');an.href=u;an.download='DuckCardsRogue.apk';an.click();s.textContent='完成！请在下载管理中找到 DuckCardsRogue.apk 并安装。'}document.getElementById('g').addEventListener('click',go);</script>
