<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>组装并下载 APK</title>
<style>body{font-family:system-ui,sans-serif;margin:24px;}button{font-size:18px;padding:12px 20px;}#s{margin-top:16px;}</style>
</head>
<body>
<h2>鸭鸭卡牌 Rogue · APK 组装</h2>
<p>点击下方按钮，浏览器会自动下载 6 个分卷并在本地拼接成完整的 APK，然后保存到你的手机。</p>
<button id="go">组装并下载 APK（约 99 MB）</button>
<p id="s"></p>
<script>
const NAMES = ['part_00', 'part_01', 'part_02', 'part_03', 'part_04', 'part_05'];
async function fetchRetry(url, tries=4){
  for(let i=0;i<tries;i++){
    try{const r=await fetch(url); if(r.ok) return r;}catch(e){}
    await new Promise(r=>setTimeout(r,800));
  }
  throw new Error('下载失败: '+url);
}
async function assemble(){
  const s=document.getElementById('s');
  const bufs=[]; let total=0;
  for(let i=0;i<NAMES.length;i++){
    s.textContent=`下载分卷 ${i+1}/${NAMES.length} …`;
    const r=await fetchRetry(NAMES[i]);
    const ab=await r.arrayBuffer();
    bufs.push(new Uint8Array(ab)); total+=ab.byteLength;
  }
  s.textContent='正在拼接…';
  const out=new Uint8Array(total); let pos=0;
  for(const b of bufs){out.set(b,pos);pos+=b.length;}
  const blob=new Blob([out],{type:'application/vnd.android.package-archive'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='DuckCardsRogue.apk';
  document.body.appendChild(a); a.click();
  s.textContent='完成！已保存 DuckCardsRogue.apk，请在下载管理中找到并安装。';
}
document.getElementById('go').addEventListener('click',assemble);
</script>
</body>
</html>
