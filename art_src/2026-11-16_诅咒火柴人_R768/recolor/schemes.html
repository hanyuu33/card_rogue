<h1>R768 配色试验 — 同一个火柴人，只换底/图两色</h1>
<p class="lead">底色的白被换掉之后，「图色」必须同时调亮，否则对比度一起没了。</p>
<p class="hint">对比度按 WCAG 算：<b>≥4.5:1</b> 才算小尺寸可读。
卡图会缩到约 150px 宽看，低于这条线的在小图上会糊。</p>
